<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дегустации</title>
<meta name="theme-color" content="#0E1A33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дегустации">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F2F0EC;--card:#FBFAF7;--ink:#1D2230;--muted:#6E6A63;--line:#E0DBD2;--field:#fff;
--navy1:#0E1A33;--navy2:#22407A;--or1:#F7A350;--or2:#DC5A2A;--sand:#F4B37A;--ok:#1E7A45;--bad:#C0392B;--mid:#B7791F;
--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Manrope',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
--grad-navy:linear-gradient(145deg,var(--navy1),var(--navy2));--grad-or:linear-gradient(90deg,var(--or1),var(--or2))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B111F;--card:#141B2C;--ink:#EDE8E0;--muted:#A39E95;--line:#263048;--field:#0F1626}}
:root[data-theme="dark"]{--bg:#0B111F;--card:#141B2C;--ink:#EDE8E0;--muted:#A39E95;--line:#263048;--field:#0F1626}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:18px 16px 56px}
img{max-width:100%}
button{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.hero{position:relative;overflow:hidden;background:var(--grad-navy);color:#F6F1EA;border-radius:24px;padding:28px 22px 24px}
.hero::before{content:"";position:absolute;right:-110px;top:-110px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(240,138,60,.55),rgba(240,138,60,0) 70%);pointer-events:none}
.hero>*{position:relative}
.brand{font-family:var(--serif);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--sand);margin:0 0 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand a{font-family:var(--sans);letter-spacing:0;text-transform:none;font-size:13px;color:var(--sand);text-decoration:none;border:1px solid rgba(244,179,122,.4);border-radius:999px;padding:4px 12px}
h1{font-family:var(--serif);font-weight:600;font-size:42px;line-height:1.02;margin:0 0 10px}
h2{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;margin:0 0 4px}
h3{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.1;margin:0}
.date{display:inline-block;font-size:13px;font-weight:600;color:#fff;background:var(--grad-or);border-radius:999px;padding:5px 14px;margin:0 0 18px}
.date:empty{display:none}
.letter{font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.45;margin:0 0 14px;white-space:pre-line}
.sign{font-family:var(--serif);font-size:18px;color:var(--sand);margin:0}
.chef{display:flex;align-items:center;gap:14px}
.chef img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 0 0 2px var(--sand)}
.menu{margin:20px 0 0;padding:16px 0 0;border-top:1px solid rgba(244,179,122,.35)}
.menu p{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sand);margin:0 0 8px}
.menu ol{margin:0;padding:0;list-style:none;counter-reset:m}
.menu li{counter-increment:m;display:flex;gap:12px;font-size:15px;line-height:1.4;padding:4px 0}
.menu li::before{content:counter(m);flex:0 0 22px;height:22px;border-radius:50%;background:var(--grad-or);color:#fff;font:600 12px/22px var(--sans);text-align:center}
.menu+.menu{margin-top:12px}
.sub{margin:0 0 14px;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px;margin-top:18px}
.muted{color:var(--muted)}
.state{text-align:center;padding:22vh 12px 0}
.state h2{margin-bottom:8px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--or2);animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--grad-or);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(220,90,42,.25)}
.btn.navy{background:var(--grad-navy);border-color:transparent;color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.wide{width:100%;padding:15px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.err{color:var(--bad);font-size:14px;margin:12px 0 0;min-height:1em}
.okmsg{color:var(--ok);font-size:14px;margin:12px 0 0}
/* поля */
label.l{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
input[type=text],input[type=number],input[type=password],input[type=tel],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{border-color:var(--navy2)}
.f{margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:transparent;font:500 14px var(--sans);border-radius:999px;padding:8px 14px;cursor:pointer}
.chips button.on{background:var(--grad-navy);border-color:transparent;color:#fff}
/* каталог */
.cat{display:grid;gap:14px;margin-top:18px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.tc .top{position:relative;overflow:hidden;background:var(--grad-navy);color:#F6F1EA;padding:16px 18px}
.tc .top::before{content:"";position:absolute;right:-60px;top:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(240,138,60,.45),rgba(240,138,60,0) 70%)}
.tc .top>*{position:relative}
.tc .tt{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.tc h3{color:#fff}
.tc .meta{font-size:13px;color:#D8DCE6;margin:6px 0 0}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;margin:8px 0 0}
.pill.open{background:rgba(52,212,122,.18);color:#7BE3A6}
.pill.done{background:rgba(255,255,255,.1);color:#C9CFDD}
.score{flex-shrink:0;text-align:center;background:var(--grad-or);border-radius:16px;padding:8px 12px 6px;min-width:68px;color:#fff}
.score b{display:block;font-family:var(--serif);font-size:30px;line-height:1}
.score span{font-size:11px;color:#FFE9D6}
.tc .bot{padding:12px 18px 16px}
.tc .stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:0 0 12px}
.tc .stats b{color:var(--ink)}
/* анкета */
.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);margin:0 -16px;padding:10px 16px}
.progress span{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
.track{display:block;height:7px;border-radius:999px;background:var(--line);overflow:hidden}
.fill{display:block;height:100%;width:0;border-radius:999px;background:var(--grad-or);transition:width .3s}
.orn{display:flex;align-items:center;gap:12px;margin:40px 0 0}
.orn::before,.orn::after{content:"";flex:1;height:1px}
.orn::before{background:linear-gradient(90deg,rgba(34,64,122,0),rgba(34,64,122,.5))}
.orn::after{background:linear-gradient(90deg,rgba(224,113,47,.5),rgba(224,113,47,0))}
.orn i{width:9px;height:9px;transform:rotate(45deg);background:var(--grad-or)}
.dish{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-top:18px}
.dhead{position:relative;overflow:hidden;background:var(--grad-navy);color:#F6F1EA;padding:18px 18px 16px}
.dhead::before{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(240,138,60,.5),rgba(240,138,60,0) 70%);pointer-events:none}
.dhead>*{position:relative}
.lab{margin:0 0 4px;font-family:var(--serif);font-size:17px;font-weight:600;color:var(--sand)}
.dhead h3{color:#fff}
.dhead .tt{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.desc{margin:8px 0 0;color:#D8DCE6;font-size:14px}
.allerg{margin:6px 0 0;color:var(--sand);font-size:13px}
.body{padding:14px 18px 18px}
.legend{font-size:13px;color:var(--muted);margin:0 0 4px}
.crit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.legend+.crit{border-top:0}
.crit span{font-size:15px}
.scale{display:flex;gap:6px;flex-shrink:0}
.scale button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;font:600 15px var(--sans);cursor:pointer}
.scale button.on{background:var(--grad-or);border-color:transparent;color:#fff}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 2px;border-top:1px solid var(--line)}
.qrow .chips{flex-wrap:nowrap;flex-shrink:0}
.comment{margin-top:12px}
.hero.bhero{margin-top:22px}
.thanks{padding-top:16vh;text-align:center}
.thanks .letter{color:var(--ink)}
.chefbig{display:block;width:104px;height:104px;border-radius:50%;object-fit:cover;margin:0 auto 22px;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--or2)}
/* итоги */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 18px}
.kpis div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px}
.kpis b{display:block;font-family:var(--serif);font-size:32px;line-height:1;font-weight:600;color:#fff}
.kpis span{font-size:12px;color:#C9CFDD;line-height:1.3;display:block;margin-top:6px}
.who{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid rgba(244,179,122,.3);padding-top:14px}
.who p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.2;color:var(--sand)}
.ppl{margin:12px 0 0;font-size:13px;color:#C9CFDD}
.flt{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:14px -16px 0;padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.flt .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.flt .chips button{white-space:nowrap}
.flt .chips+.chips{margin-top:8px}
.rank ol{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:26px 1fr 26% 34px;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.pos{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--or2)}
.rn{font-size:14px;line-height:1.3}
.rn em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.rank b,.cr b{font-weight:700;font-size:14px;text-align:right}
.bh{font-family:var(--serif);font-weight:600;font-size:40px;margin:20px 0 2px}
.bsub{margin:0;color:var(--muted);font-size:13px}
.ph{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--line)}
.rec{margin:10px 0 0;font-size:13px;color:#D8DCE6}.rec b{color:#fff}
.cr{display:grid;grid-template-columns:44% 1fr 34px;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.portion{display:flex;gap:6px;margin:12px 0 0;font-size:13px}
.portion span{flex:1;text-align:center;background:var(--bg);border-radius:10px;padding:6px 4px}
.portion b{display:block;font-size:16px}
.tw{overflow-x:auto;margin:14px -18px 0;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
.tw table{min-width:520px}
th{font-weight:600;color:var(--muted);text-align:center;padding:6px 4px;border-bottom:1px solid var(--line);line-height:1.2}
th:first-child,td.nm,td.l{text-align:left}
td{text-align:center;padding:7px 4px;border-bottom:1px solid var(--line)}
td.nm{font-weight:600;white-space:nowrap}
td.nm small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.s5{color:var(--ok);font-weight:700}.s3{color:var(--mid)}.s2,.s1{color:var(--bad);font-weight:700}.s0{color:var(--muted)}
.rда{color:var(--ok);font-weight:600}.rнет{color:var(--bad);font-weight:600}
.cm{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.cm li{display:flex;gap:10px;align-items:flex-start}
.av{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--grad-navy);color:#fff;font:700 11px/30px var(--sans);text-align:center}
.cm p{margin:0;background:var(--bg);border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:14px}
.cm b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.fin h4,.kit h4{font-family:var(--serif);font-size:22px;font-weight:600;margin:18px 0 8px}
.votes{list-style:none;margin:0;padding:0}
.votes li{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.votes li:first-child{border-top:0}
.votes b{flex-shrink:0;width:38px;height:38px;border-radius:12px;background:var(--grad-or);color:#fff;font:600 20px/38px var(--serif);text-align:center}
.votes em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.kit .st{display:inline-block;font-weight:700;border-radius:999px;padding:4px 12px;font-size:13px}
.kit .st.ok{background:rgba(30,122,69,.12);color:var(--ok)}.kit .st.bad{background:rgba(192,57,43,.12);color:var(--bad)}
.kit .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:12px}
.kit .gal img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px}
.kit td,.kit th{text-align:left}.kit td.r,.kit th.r{text-align:right}
.kit tfoot td{font-weight:700;border-bottom:0}
footer{margin:30px 0 0;text-align:center;font-size:12px;color:var(--muted)}
/* управление */
.adm .it{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.adm .it:first-child{border-top:0}
.adm .it .row{justify-content:flex-end}
.pos-ed{border:1px solid var(--line);border-radius:16px;padding:12px;margin:0 0 10px;background:var(--bg)}
.pos-ed .hd{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-weight:700}
.pos-ed .thumb{width:64px;height:64px;border-radius:10px;object-fit:cover}
.lines .ln{display:grid;grid-template-columns:1fr 70px 64px 90px 30px;gap:6px;margin:0 0 6px;align-items:center}
.lines.left .ln{grid-template-columns:1fr 64px 56px 110px 30px}
.x{border:0;background:transparent;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--card);border-radius:22px;padding:22px;max-width:360px;width:100%;text-align:center}
.modal .qr{background:#fff;border-radius:14px;padding:14px;display:inline-block;margin:10px 0}
.modal .qr img,.modal .qr canvas{display:block;width:240px;height:240px}
.lnk{word-break:break-all;font-size:13px;color:var(--muted);margin:6px 0 12px}
@media (min-width:1024px){
  main{max-width:1240px;padding:32px 40px 72px}
  main.narrow{max-width:760px}
  h1{font-size:60px}
  .cat{grid-template-columns:repeat(3,1fr);gap:20px}
  .res .hero{display:grid;grid-template-columns:1.35fr 1fr;gap:0 40px;align-items:center;padding:34px 44px 28px}
  .res .hero .brand,.res .hero h1,.res .hero .date{grid-column:1}
  .res .hero .date{justify-self:start}
  .res .hero h1{white-space:nowrap}
  .res .kpis{grid-column:2;grid-row:1/4;align-self:center;margin:0}
  .res .kpis b{font-size:42px}
  .res .who,.res .ppl{grid-column:1/-1}
  .flt{margin:20px 0 0;padding:12px 0}
  .rank{padding:26px 32px}
  .rank ol{columns:2;column-gap:48px}
  .rank li{break-inside:avoid}
  .rank li:first-child{border-top:1px solid var(--line)}
  .bh{font-size:52px}
  .kit{padding:26px 32px}
  .kit .cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 32px;align-items:start}
  table{font-size:12px}.tw table{min-width:0}
  th{font-size:11px;padding:6px 2px}td{padding:7px 2px}
}
@media (min-width:1200px){
  .block{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-items:stretch}
  .block .bh,.block .bsub{grid-column:1/-1}
  .block .dish{display:flex;flex-direction:column}
  .block .dish .body{flex:1}
  .block .ph{aspect-ratio:4/3}
  .block .dish:last-of-type:nth-of-type(odd){grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .block .dish:last-of-type:nth-of-type(odd) .ph{grid-row:1/3;height:100%;aspect-ratio:auto;align-self:stretch}
  .block .dish:last-of-type:nth-of-type(odd):not(:has(.ph)) .dhead{grid-column:1/-1}
  .block .dish:last-of-type:nth-of-type(odd):not(:has(.ph)) .body{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.4fr;gap:0 32px;align-items:start}
  .block .dish:last-of-type:nth-of-type(odd):not(:has(.ph)) .tw{margin:0;padding:0}
  .block .dish:last-of-type:nth-of-type(odd):not(:has(.ph)) .cm{grid-column:1/-1}
  .fin{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;padding:26px 32px}
  .fin h2{grid-column:1/-1}
}
@media (min-width:640px) and (max-width:1199px){.res .dish{display:grid;grid-template-columns:300px 1fr}.res .dish .ph{grid-row:1/3;height:100%;aspect-ratio:auto}.res .dish:not(:has(.ph)){display:block}}
</style>
</head>
<body>
<main id="app"><div class="state"><div class="spin"></div><p class="muted">Загружаем</p></div></main>
<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbyhbatWUegEAh9yAj-PlJ1XAxogDaR9OHeBsLzNRldkBhaUz3RjhsQ7AF39GiB6nhcxuA/exec';
const BASE = location.origin + location.pathname;
const KC = ['Внешний вид','Аромат','Вкус','Текстура','Общее впечатление'];
const BC = ['Внешний вид','Аромат','Вкус','Баланс','Температура подачи','Общее впечатление'];
const ROLES = ['Акционер','УК','Персонал'];
const PORTIONS = ['Мало','Норма','Много'];
const app = document.getElementById('app');
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = x => x == null || isNaN(x) ? '–' : (Math.round(x * 10) / 10).toFixed(1).replace('.', ',');
const money = x => (Math.round(Number(x) || 0)).toLocaleString('ru-RU').replace(/,/g, ' ') + ' ₸';
const ini = n => String(n).split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();

function timeout(ms){ const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; }
async function apiGet(params){
  const r = await fetch(API + '?' + new URLSearchParams(params), {signal: timeout(30000)});
  return r.json();
}
async function apiPost(body){
  const r = await fetch(API, {method:'POST', body: JSON.stringify(body), signal: timeout(60000)});
  return r.json();
}
function state(title, text, extra){ app.className = ''; app.innerHTML = '<div class="state"><h2>' + esc(title) + '</h2><p class="muted">' + esc(text || '') + '</p>' + (extra || '') + '</div>'; }
function loading(){ app.className = ''; app.innerHTML = '<div class="state"><div class="spin"></div><p class="muted">Загружаем</p></div>'; }
function critOf(T, d){ const b = (T.blocks || []).find(x => x.name === d.block); return b && b.criteria.length ? b.criteria : (T.criteria || KC); }
function labelOf(T, d){
  if (!d.section) return (/бар/i.test(d.block || '') ? 'Напиток ' : 'Блюдо ') + d.n;
  const same = T.dishes.filter(x => x.section === d.section);
  return same.length > 1 ? d.section + ' ' + (same.indexOf(d) + 1) : d.section;
}
function imgFallback(el){
  const id = el.getAttribute('data-id'); if (!id || el.dataset.tried) { el.remove(); return; }
  el.dataset.tried = 1;
  apiGet({action:'img', id}).then(r => { if (r.ok) el.src = r.data; else el.remove(); }).catch(() => el.remove());
}
function photoTag(url, id, cls, alt){
  if (!url) return '';
  return '<img class="' + cls + '" src="' + esc(url) + '" data-id="' + esc(id || '') + '" alt="' + esc(alt || '') + '" loading="lazy" onerror="imgFallback(this)">';
}

function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const [p, id] = h.split('/');
  window.scrollTo(0, 0);
  $$('.modal').forEach(m => m.remove());
  if (p === 't' && id) return viewForm(decodeURIComponent(id));
  if (p === 'r' && id) return viewResults(decodeURIComponent(id));
  if (p === 'admin') return viewAdmin();
  if (p === 'edit') return viewEditor(id ? decodeURIComponent(id) : '');
  if (p === 'kitchen' && id) return viewKitchen(decodeURIComponent(id));
  return viewHome();
}

function showQR(id){
  const url = linkForm(id);

  document.body.appendChild(m);
  m.onclick = e => { if (e.target === m) m.remove(); };
  $('#qclose', m).onclick = () => m.remove();
  $('#qcopy', m).onclick = () => { navigator.clipboard && navigator.clipboard.writeText(url); $('#qcopy', m).textContent = 'Скопировано'; };
  const draw = () => {
    if (!window.QRCode) return setTimeout(draw, 200);
    new QRCode($('#qrbox', m), {text: url, width: 480, height: 480, colorDark: '#1B2A4A', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M});
    setTimeout(() => { const c = $('#qrbox canvas', m); if (c) $('#qdl', m).href = c.toDataURL('image/png'); }, 100);
  };
  draw();
}

let F = null;
async function viewForm(id){
  loading();
  let T; try { T = await apiGet({t: id}); } catch(e){ return state('Нет связи', 'Не удалось загрузить дегустацию. Обновите страницу.'); }
  if (!T || T.error) return state('Дегустация не найдена', 'Проверьте ссылку или QR-код.');
  const sentKey = 'dg-sent-' + T.id, draftKey = 'dg-draft-' + T.id;
  if (store.get(sentKey)) return thanks(T);
  if (!T.open) return state('Анкета закрыта', 'Приём оценок по этой дегустации завершён.', '<p><a class="btn navy" href="#/r/' + esc(T.id) + '">Смотреть итоги</a></p>');
  F = {T, sentKey, draftKey, answers:{}, fin:{best:'', fix:'', overall:''}, role:'', guest:'', confirm:false};
  T.dishes.forEach(d => F.answers[d.n] = {scores:{}, comment:'', recommend:'', portion:''});
  const dr = store.get(draftKey);
  if (dr){ Object.keys(dr.answers || {}).forEach(n => { if (F.answers[n]) Object.assign(F.answers[n], dr.answers[n]); }); Object.assign(F.fin, dr.fin || {}); F.role = dr.role || ''; F.guest = dr.guest || ''; }
  renderForm();
}
function saveDraft(){ store.set(F.draftKey, {answers: F.answers, fin: F.fin, role: F.role, guest: F.guest}); }
function renderForm(){
  const T = F.T; app.className = 'narrow';

  h += '</header><div class="progress"><span id="pt"></span><div class="track"><div class="fill" id="pf"></div></div></div>';
  const P = (T.participants || []).filter(p => p.name);
  const inList = P.some(p => p.name === F.guest);
  h += '<div class="card">';
  if (P.length){
    h += '<label class="l">Кто вы</label><div class="chips" data-who style="margin-bottom:14px">' + P.map(p => '<button type="button" data-v="' + esc(p.name) + '"' + (F.guest === p.name ? ' class="on"' : '') + '>' + esc(p.name) + '</button>').join('') + '<button type="button" data-v="__other"' + (F.guest && !inList ? ' class="on"' : '') + '>Другой участник</button></div>';
  }

  const me = P.find(p => p.name === F.guest);
  h += '<div id="rolebox"' + (me && me.role ? ' hidden' : '') + '><label class="l">Ваша роль</label><div class="chips" data-role>' + ROLES.map(r => '<button type="button" data-v="' + r + '"' + (F.role === r ? ' class="on"' : '') + '>' + r + '</button>').join('') + '</div></div></div>';
  let prev = null;
  T.dishes.forEach((d, i) => {
    if (i > 0 && d.block && d.block !== prev){
      const b = (T.blocks || []).find(x => x.name === d.block);
      h += '<div class="orn"><i></i></div><header class="hero bhero"><p class="brand"><span>' + esc(projOf(T)) + '</span></p><h1>' + esc(d.block) + '</h1>' + (b && b.signature ? '<p class="sign">' + esc(b.signature) + '</p>' : '') + '</header>';
    }
    prev = d.block;
    const a = F.answers[d.n];
    h += '<div class="orn"><i></i></div><section class="dish" data-n="' + d.n + '"><div class="dhead"><p class="lab">' + esc(labelOf(T, d)) + '</p><h3>' + esc(d.name) + '</h3>';
    if (d.desc) h += '<p class="desc">' + esc(d.desc) + '</p>';
    if (d.allergens) h += '<p class="allerg">Аллергены: ' + esc(d.allergens) + '</p>';
    h += '</div><div class="body"><p class="legend">1 – слабо, 5 – отлично</p>';
    critOf(T, d).forEach(c => {
      h += '<div class="crit"><span>' + esc(c) + '</span><div class="scale" data-c="' + esc(c) + '">' + [1,2,3,4,5].map(v => '<button type="button" data-v="' + v + '"' + (a.scores[c] === v ? ' class="on"' : '') + '>' + v + '</button>').join('') + '</div></div>';
    });
    h += '<div class="qrow"><span>Размер порции</span><div class="chips" data-q="portion">' + PORTIONS.map(v => '<button type="button" data-v="' + v + '"' + (a.portion === v ? ' class="on"' : '') + '>' + v + '</button>').join('') + '</div></div>';
    h += '<div class="qrow"><span>Порекомендовали бы гостю?</span><div class="chips" data-q="recommend">' + ['Да','Нет'].map(v => '<button type="button" data-v="' + v.toLowerCase() + '"' + (a.recommend === v.toLowerCase() ? ' class="on"' : '') + '>' + v + '</button>').join('') + '</div></div>';
    h += '<div class="comment"><label class="l">Ваш комментарий</label><textarea data-cm rows="3" maxlength="1000" placeholder="Что понравилось, что бы вы изменили">' + esc(a.comment) + '</textarea></div></div></section>';
  });
  const chipsOf = k => '<div class="chips" data-fin="' + k + '">' + T.dishes.map(d => '<button type="button" data-v="' + esc(d.name) + '"' + (F.fin[k] === d.name ? ' class="on"' : '') + '>' + esc(d.name) + '</button>').join('') + '</div>';
  h += '<div class="orn"><i></i></div><section class="dish"><div class="dhead"><p class="lab">Итог</p><h3>Ваш выбор</h3></div><div class="body">';
  h += '<div class="f"><label class="l">Что понравилось больше всего</label>' + chipsOf('best') + '</div>';
  h += '<div class="f"><label class="l">Что стоит доработать</label>' + chipsOf('fix') + '</div>';
  h += '<div class="f"><label class="l">Общее впечатление от дегустации</label><textarea id="overall" rows="3" maxlength="1500">' + esc(F.fin.overall) + '</textarea></div></div></section>';
  h += '<button class="btn pri wide" id="send" style="margin-top:28px">Отправить оценки</button><p class="err" id="err"></p>';
  app.innerHTML = h;
  progress();
  app.onclick = e => {
    const b = e.target.closest('button[data-v]'); if (!b) return;
    const box = b.parentNode; const v = b.dataset.v;
    if (box.dataset.who !== undefined){
      const p = (F.T.participants || []).find(x => x.name === v);
      if (p){ F.guest = p.name; F.role = p.role || F.role; F.other = false; } else { F.guest = ''; F.other = true; }
      saveDraft(); renderForm(); return;
    }
    if (box.dataset.role !== undefined){ F.role = v; }
    else if (box.dataset.fin){ F.fin[box.dataset.fin] = F.fin[box.dataset.fin] === v ? '' : v; }
    else if (box.dataset.q){ const a = F.answers[b.closest('.dish').dataset.n]; a[box.dataset.q] = a[box.dataset.q] === v ? '' : v; }
    else if (box.dataset.c){ F.answers[b.closest('.dish').dataset.n].scores[box.dataset.c] = Number(v); }
    const cur = box.dataset.fin ? F.fin[box.dataset.fin] : box.dataset.q ? F.answers[b.closest('.dish').dataset.n][box.dataset.q] : box.dataset.c ? String(F.answers[b.closest('.dish').dataset.n].scores[box.dataset.c]) : F.role;
    $$('button', box).forEach(x => x.classList.toggle('on', x.dataset.v === cur));
    F.confirm = false; progress(); saveDraft();
  };
  app.oninput = e => {
    if (e.target.id === 'guest') F.guest = e.target.value;
    else if (e.target.id === 'overall') F.fin.overall = e.target.value;
    else if (e.target.dataset.cm !== undefined) F.answers[e.target.closest('.dish').dataset.n].comment = e.target.value;
    saveDraft();
  };
  $('#send').onclick = sendForm;

function progress(){
  const T = F.T; const done = T.dishes.filter(d => critOf(T, d).every(c => F.answers[d.n].scores[c])).length;
  const pt = $('#pt'), pf = $('#pf'); if (!pt) return;
  pt.textContent = 'Оценено ' + done + ' из ' + T.dishes.length; pf.style.width = (done / T.dishes.length * 100) + '%';
}
async function sendForm(){
  const T = F.T, err = $('#err'), btn = $('#send');
  const guest = F.guest.trim();
  if (!guest){ err.textContent = 'Укажите ваше имя в начале страницы.'; $('#guest').focus(); return; }
  if (!F.role){ err.textContent = 'Отметьте вашу роль в начале страницы.'; return; }
  const empty = T.dishes.filter(d => critOf(T, d).some(c => !F.answers[d.n].scores[c])).map(d => labelOf(T, d).toLowerCase());
  if (empty.length && !F.confirm){ F.confirm = true; err.textContent = 'Не все оценки проставлены: ' + empty.join(', ') + '. Можно дополнить или нажать ещё раз, чтобы отправить как есть.'; btn.textContent = 'Отправить как есть'; return; }
  btn.disabled = true; btn.textContent = 'Отправляем'; err.textContent = '';
  const rows = T.dishes.map(d => { const a = F.answers[d.n]; return {n: d.n, name: d.name, scores: a.scores, portion: a.portion, recommend: a.recommend, comment: a.comment.trim()}; });
  const ov = F.fin.overall.trim();
  if (F.fin.best || F.fin.fix || ov) rows.push({n: Math.max.apply(null, T.dishes.map(d => Number(d.n) || 0)) + 1, name: 'Итог', scores: {}, comment: [F.fin.best ? 'Лучшее: ' + F.fin.best : '', F.fin.fix ? 'Доработать: ' + F.fin.fix : '', ov ? 'Общее впечатление: ' + ov : ''].filter(Boolean).join('. ')});
  try {
    const r = await apiPost({tasting: T.id, guest, role: F.role, answers: rows});
    if (!r.ok) throw new Error(r.error);
    store.del(F.draftKey); store.set(F.sentKey, 1); thanks(T);
  } catch(e){
    btn.disabled = false; btn.textContent = F.confirm ? 'Отправить как есть' : 'Отправить оценки';
    err.textContent = String(e.message) === 'closed' ? 'Анкета уже закрыта – оценки не принимаются.' : 'Оценки не отправились. Проверьте интернет и нажмите ещё раз.';
  }
}
function thanks(T){
  window.scrollTo(0, 0); app.className = 'narrow';
  app.innerHTML = '<div class="thanks">' + (T.chefPhoto ? '<img class="chefbig" src="' + esc(T.chefPhoto) + '" alt="" onerror="this.remove()">' : '') + '<p class="letter">Благодарю вас за участие в дегустации.</p><p class="sign" style="color:var(--or2)">' + esc(T.signature || '') + '</p></div>';
}

/* ---------------- итоги ---------------- */
let R = null;
async function viewResults(id){
  loading();
  let r; try { r = await apiGet({action:'results', t: id}); } catch(e){ return state('Нет связи', 'Не удалось загрузить итоги. Обновите страницу.'); }
  if (!r.ok) return state('Дегустация не найдена', 'Проверьте ссылку.');
  const T = r.tasting;
  const last = {}; r.answers.forEach(a => last[a['Гость'] + '|' + a['№']] = a);
  const guests = []; const role = {};
  Object.values(last).forEach(a => { if (guests.indexOf(a['Гость']) < 0) guests.push(a['Гость']); if (a['Роль']) role[a['Гость']] = a['Роль']; });
  (T.participants || []).forEach(p => { if (p.name && p.role && !role[p.name]) role[p.name] = p.role; });
  R = {T, last, guests, role, kitchen: r.kitchen, fb: 'all', fr: 'all'};
  renderResults();
}
function recOf(a){ const g = String(a['Гостю'] || '').toLowerCase(); if (g) return g; const m = String(a['Комментарий'] || '').match(/^Рекомендую гостю: (да|нет)/); return m ? m[1] : ''; }
function commentOf(a){ return String(a['Комментарий'] || '').replace(/^Рекомендую гостю: (да|нет)\.?\s*/, ''); }
function num(v){ const x = Number(String(v).replace(',', '.')); return x >= 1 && x <= 5 ? x : null; }
function renderResults(){
  const {T, last, guests, role} = R;
  const G = guests.filter(g => R.fr === 'all' || role[g] === R.fr);
  const stats = {};
  T.dishes.forEach(d => {
    const cr = critOf(T, d); const per = [];
    G.forEach(g => { const a = last[g + '|' + d.n]; if (a) per.push({g, a, sc: Object.fromEntries(cr.map(c => [c, num(a[c])])), rec: recOf(a), cm: commentOf(a), por: a['Порция'] || ''}); });
    const cav = {}; let all = [];
    cr.forEach(c => { const v = per.map(p => p.sc[c]).filter(Boolean); cav[c] = mean(v); all = all.concat(v); });
    const por = {}; PORTIONS.forEach(p => por[p] = per.filter(x => x.por === p).length);
    stats[d.n] = {cr, per, cav, avg: mean(all), yes: per.filter(p => p.rec === 'да').length, no: per.filter(p => p.rec === 'нет').length, por};
  });
  const blocks = []; T.dishes.forEach(d => { if (blocks.indexOf(d.block) < 0) blocks.push(d.block); });
  const roles = ROLES.filter(r => guests.some(g => role[g] === r));
  const bAvg = b => mean(T.dishes.filter(d => d.block === b).map(d => stats[d.n].avg).filter(x => x != null));
  app.className = 'res';
  let h = '<header class="hero"><p class="brand"><span>' + esc(projOf(T)) + '</span><a href="#/">Все дегустации</a></p><h1>Итоги дегустации</h1><p class="date">' + esc(T.date) + '</p>';
  h += '<div class="kpis"><div><b>' + G.length + '</b><span>участников</span></div>' + blocks.slice(0, 2).map(b => '<div><b>' + fmt(bAvg(b)) + '</b><span>' + esc((b || 'позиции').toLowerCase()) + ', средний балл</span></div>').join('') + '</div>';
  const sigs = blocks.slice(0, 2).map(b => { const x = (T.blocks || []).find(y => y.name === b); return x ? x.signature : ''; });
  h += '<div class="who"><div class="chef">' + (T.chefPhoto ? '<img src="' + esc(T.chefPhoto) + '" alt="" onerror="this.remove()">' : '') + '<p>' + esc(sigs[0] || T.signature || '') + '</p></div>' + (sigs[1] ? '<p style="text-align:right">' + esc(sigs[1]) + '</p>' : '') + '</div>';

    h += '<table><thead><tr><th>Продукт</th><th class="r">Кол-во</th><th>Куда</th><th class="r">Сумма</th></tr></thead><tbody>' + k.leftovers.map(x => '<tr><td>' + esc(x.name) + '</td><td class="r">' + esc(x.qty || '') + ' ' + esc(x.unit || '') + '</td><td>' + esc(x.dest || '') + '</td><td class="r">' + (x.sum ? money(x.sum) : '–') + '</td></tr>').join('') + '</tbody></table>';

function resizeImage(file, max){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82)); };
    img.onerror = rej; img.src = url;
  });
}
async function uploadPhoto(file, name){
  const data = await resizeImage(file, 1400);
  const r = await apiPost({action:'upload', pin: pin(), name, data});
  if (!r.ok) throw new Error(r.error); return r;
}
function pickFile(multiple){ return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; if (multiple) i.multiple = true; i.onchange = () => res(Array.from(i.files || [])); i.click(); }); }

    const st = $('[data-phst="' + i + '"]'); st.textContent = 'Загружаем'; b.disabled = true;
    try { const r = await uploadPhoto(f, T.id + '-' + (i + 1)); T.dishes[i].photo = r.id; T.dishes[i]._ph = URL.createObjectURL(f); renderEditor(); }
    catch(e){ st.textContent = 'Не загрузилось'; b.disabled = false; }
  });
  $('#e-chef').onclick = async () => {
    sync(); const [f] = await pickFile(false); if (!f) return; $('#e-chef-st').textContent = 'Загружаем';
    try { const r = await uploadPhoto(f, T.id + '-chef'); T.chefPhotoId = r.id; T.chefPhoto = URL.createObjectURL(f); renderEditor(); }
    catch(e){ $('#e-chef-st').textContent = 'Не загрузилось'; }
  };
  $('#e-save').onclick = async () => {
    sync(); const err = $('#err');
    if (!/^[\w-]{2,30}$/.test(T.id)) { err.textContent = 'ID – латиница, цифры и дефис, например dio-02.'; return; }
    if (!T.project) { err.textContent = 'Укажите проект – заведение.'; return; }
    if (!T.blocks.length) { err.textContent = 'Добавьте хотя бы один блок.'; return; }
    const ds = T.dishes.filter(d => d.name);
    if (!ds.length) { err.textContent = 'Добавьте хотя бы одну позицию с названием.'; return; }
    const btn = $('#e-save'); btn.disabled = true; btn.textContent = 'Сохраняем'; err.textContent = '';
    const data = {id: T.id, project: T.project, participants: T.participants.filter(p => p.name), date: T.date, title: T.title, greeting: T.greeting, signature: T.signature, active: E.isNew ? true : !!T.open,
      chefPhoto: T.chefPhotoId || '', blocks: T.blocks, dishes: ds.map((d, i) => ({n: i + 1, block: d.block, section: d.section, name: d.name, desc: d.desc, allergens: d.allergens, photo: d.photo || ''}))};
    try { const r = await apiPost({action:'create', pin: pin(), data}); if (!r.ok) throw new Error(r.error); location.hash = '#/admin'; if (E.isNew) setTimeout(() => showQR(T.id), 600); }
    catch(e){ btn.disabled = false; btn.textContent = 'Сохранить'; err.textContent = 'Не сохранилось: ' + e.message; }
  };
}

/* кухня после дегустации */
let K = null;
async function viewKitchen(id){
  loading();
  let r; try { r = await apiGet({action:'results', t: id}); } catch(e){ return state('Нет связи', 'Обновите страницу.'); }
  if (!r.ok) return state('Не найдено', id);
  const k = r.kitchen || {};
  K = {id, title: r.tasting.title, date: r.tasting.date, workplace: k.workplace || '', comment: k.comment || '',
       photos: (k.photoIds || []).map((pid, i) => ({id: pid, url: (k.photos || [])[i]})).filter(x => x.id),
       request: k.request && k.request.length ? k.request : [{name:'', qty:'', unit:'кг', sum:''}],
       leftovers: k.leftovers && k.leftovers.length ? k.leftovers : [{name:'', qty:'', unit:'кг', dest:'В работу', sum:''}]};
  renderKitchen();
}
function renderKitchen(){
  app.className = 'narrow';
  const units = ['кг','г','л','шт','уп'];
  const uSel = (v, k) => '<select data-k="' + k + '">' + units.map(u => '<option' + (u === v ? ' selected' : '') + '>' + u + '</option>').join('') + '</select>';
  let h = '<header class="hero"><p class="brand"><span>Дегустации</span><a href="#/admin">Управление</a></p><h1>Кухня после дегустации</h1><p class="ppl" style="margin:0">' + esc(K.title) + ' · ' + esc(K.date) + '</p></header>';
  h += '<div class="card"><h3>Рабочее место</h3><div class="chips" data-wp style="margin:12px 0">' + ['Чисто','Есть замечания'].map(v => '<button type="button" data-v="' + v + '"' + (K.workplace === v ? ' class="on"' : '') + '>' + v + '</button>').join('') + '</div>';
  h += '<div class="f"><label class="l">Комментарий</label><textarea id="k-cm" rows="3">' + esc(K.comment) + '</textarea></div>';
  h += '<div class="row">' + K.photos.map((p, i) => '<span style="position:relative"><img class="thumb" src="' + esc(p.url) + '" style="width:64px;height:64px;border-radius:10px;object-fit:cover" onerror="this.style.opacity=.3"><button class="x" data-delp="' + i + '" style="position:absolute;top:-8px;right:-6px">×</button></span>').join('') + '<button class="btn sm" id="k-ph">+ Фото</button><span class="sub" id="k-phst" style="margin:0"></span></div></div>';
  h += '<div class="card"><h3>Заявка на продукты</h3><p class="sub">Что шеф запросил под дегустацию</p><div class="lines" id="req">' + K.request.map((x, i) => '<div class="ln" data-i="' + i + '"><input type="text" data-k="name" placeholder="Продукт" value="' + esc(x.name) + '"><input type="text" data-k="qty" inputmode="decimal" placeholder="Кол-во" value="' + esc(x.qty) + '">' + uSel(x.unit, 'unit') + '<input type="text" data-k="sum" inputmode="numeric" placeholder="Сумма ₸" value="' + esc(x.sum) + '"><button class="x" data-del>×</button></div>').join('') + '</div><button class="btn sm" id="add-req">+ Строка</button></div>';
  h += '<div class="card"><h3>Остатки</h3><p class="sub">Что осталось после дегустации и куда ушло</p><div class="lines left" id="left">' + K.leftovers.map((x, i) => '<div class="ln" data-i="' + i + '"><input type="text" data-k="name" placeholder="Продукт" value="' + esc(x.name) + '"><input type="text" data-k="qty" inputmode="decimal" placeholder="Кол-во" value="' + esc(x.qty) + '">' + uSel(x.unit, 'unit') + '<select data-k="dest">' + ['В работу','Списание'].map(v => '<option' + (v === x.dest ? ' selected' : '') + '>' + v + '</option>').join('') + '</select><button class="x" data-del>×</button><input type="text" data-k="sum" inputmode="numeric" placeholder="Сумма ₸ (необязательно)" value="' + esc(x.sum || '') + '" style="grid-column:1/-1"></div>').join('') + '</div><button class="btn sm" id="add-left">+ Строка</button></div>';
  h += '<button class="btn pri wide" id="k-save" style="margin-top:22px">Сохранить</button><p class="err" id="err"></p>';
  app.innerHTML = h;
  const sync = () => {
    K.comment = $('#k-cm').value;
    const rd = sel => $$(sel + ' .ln').map(ln => Object.fromEntries($$('[data-k]', ln).map(i => [i.dataset.k, i.value.trim()])));
    K.request = rd('#req'); K.leftovers = rd('#left');
  };
  $('[data-wp]').onclick = e => { const b = e.target.closest('button'); if (!b) return; sync(); K.workplace = b.dataset.v; renderKitchen(); };
  $('#add-req').onclick = () => { sync(); K.request.push({name:'', qty:'', unit:'кг', sum:''}); renderKitchen(); };
  $('#add-left').onclick = () => { sync(); K.leftovers.push({name:'', qty:'', unit:'кг', dest:'В работу', sum:''}); renderKitchen(); };
  $$('#req [data-del]').forEach((b, i) => b.onclick = () => { sync(); K.request.splice(i, 1); renderKitchen(); });
  $$('#left [data-del]').forEach((b, i) => b.onclick = () => { sync(); K.leftovers.splice(i, 1); renderKitchen(); });
  $$('[data-delp]').forEach(b => b.onclick = () => { sync(); K.photos.splice(Number(b.dataset.delp), 1); renderKitchen(); });
  $('#k-ph').onclick = async () => {
    sync(); const files = await pickFile(true); if (!files.length) return;
    const st = $('#k-phst');
    for (let i = 0; i < files.length; i++){ st.textContent = 'Загружаем ' + (i + 1) + ' из ' + files.length; try { const r = await uploadPhoto(files[i], K.id + '-kitchen'); K.photos.push({id: r.id, url: URL.createObjectURL(files[i])}); } catch(e){ st.textContent = 'Часть фото не загрузилась'; } }
    renderKitchen();
  };
  $('#k-save').onclick = async () => {
    sync(); const btn = $('#k-save'); btn.disabled = true; btn.textContent = 'Сохраняем';
    const clean = a => a.filter(x => x.name).map(x => Object.assign({}, x, {sum: Number(String(x.sum || '').replace(/[^\d.,]/g, '').replace(',', '.')) || ''}));
    const data = {workplace: K.workplace, comment: K.comment, photoIds: K.photos.map(p => p.id), request: clean(K.request), leftovers: clean(K.leftovers)};
    try { const r = await apiPost({action:'kitchen', pin: pin(), t: K.id, data}); if (!r.ok) throw new Error(r.error); location.hash = '#/r/' + K.id; }
    catch(e){ btn.disabled = false; btn.textContent = 'Сохранить'; $('#err').textContent = 'Не сохранилось: ' + e.message; }
  };
}

route();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
