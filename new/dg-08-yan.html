<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Создание дегустации</title>
<style>body{margin:0;font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:#F2F0EC;color:#1D2230;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
@media (prefers-color-scheme:dark){body{background:#0B111F;color:#EDE8E0}}</style></head>
<body><p id="m">Добавляем участника…</p>
<script>
const API="https://script.google.com/macros/s/AKfycbyhbatWUegEAh9yAj-PlJ1XAxogDaR9OHeBsLzNRldkBhaUz3RjhsQ7AF39GiB6nhcxuA/exec";
const DATA={"id": "dg-08", "project": "DIO Grand Cafe", "date": "3 ноября 2026, 12:00", "title": "Дегустация от шеф-повара", "active": true, "greeting": "Добрый день, уважаемый коллега.\nПриглашаем вас на дегустацию в DIO Grand Cafe – 3 ноября 2026, 12:00. Шеф-повар Санжар Отарбаев представит 23 позиции: завтраки, салаты и закуски, горячие блюда. Просим оценить каждую позицию и оставить пару слов от себя – ваше мнение для нас важно.", "signature": "Шеф-повар Санжар Отарбаев", "participants": [{"name": "Гаухар", "role": ""}, {"name": "Данара", "role": ""}, {"name": "Эльмира", "role": ""}, {"name": "Руслан", "role": ""}, {"name": "Альбина", "role": ""}, {"name": "Зауре", "role": ""}, {"name": "Минара", "role": ""}, {"name": "Yan", "role": ""}], "blocks": [{"name": "Кухня", "signature": "Шеф-повар Санжар Отарбаев", "criteria": ["Внешний вид", "Аромат", "Вкус", "Текстура", "Общее впечатление"]}], "settings": {"jar": {"Кухня": ["Соль", "Сладость", "Кислотность"]}, "blind": false, "codes": {}}, "dishes": [{"n": 1, "block": "Кухня", "section": "Завтраки", "name": "Яйца бенедикт с сёмгой слабой соли"}, {"n": 2, "block": "Кухня", "section": "Завтраки", "name": "Зелёные драники из кабачка"}, {"n": 3, "block": "Кухня", "section": "Завтраки", "name": "Крок мадам"}, {"n": 4, "block": "Кухня", "section": "Завтраки", "name": "Блины с томлёной говядиной"}, {"n": 5, "block": "Кухня", "section": "Салаты и закуски", "name": "Зелёный салат с дрессингом из эстрагона"}, {"n": 6, "block": "Кухня", "section": "Салаты и закуски", "name": "Греческий салат с тапенадой из оливок и мятой фетой"}, {"n": 7, "block": "Кухня", "section": "Салаты и закуски", "name": "Салат с ростбифом"}, {"n": 8, "block": "Кухня", "section": "Салаты и закуски", "name": "Салат с хрустящими баклажанами"}, {"n": 9, "block": "Кухня", "section": "Салаты и закуски", "name": "Салат с тигровыми креветками и кешью"}, {"n": 10, "block": "Кухня", "section": "Салаты и закуски", "name": "Хрустящая фета с маринованным полугорьким перцем"}, {"n": 11, "block": "Кухня", "section": "Салаты и закуски", "name": "Хрустящие спринг роллы"}, {"n": 12, "block": "Кухня", "section": "Салаты и закуски", "name": "Крокеты с брискетом и чеддером"}, {"n": 13, "block": "Кухня", "section": "Салаты и закуски", "name": "Печёные оливки"}, {"n": 14, "block": "Кухня", "section": "Салаты и закуски", "name": "Паштет из печени цыплёнка с карамелью из портвейна"}, {"n": 15, "block": "Кухня", "section": "Салаты и закуски", "name": "Запечённый камамбер с вареньем и хурмой"}, {"n": 16, "block": "Кухня", "section": "Салаты и закуски", "name": "Батат фри с соусом блючиз"}, {"n": 17, "block": "Кухня", "section": "Салаты и закуски", "name": "Пицца с сёмгой слабой соли и страчателлой"}, {"n": 18, "block": "Кухня", "section": "Горячие блюда", "name": "Куриные котлеты с пюре"}, {"n": 19, "block": "Кухня", "section": "Горячие блюда", "name": "Равиоли с креветками и чили маслом"}, {"n": 20, "block": "Кухня", "section": "Горячие блюда", "name": "Бургер с кетчупом из грибов"}, {"n": 21, "block": "Кухня", "section": "Горячие блюда", "name": "Утиная ножка конфи с картофельным гратеном и ягодным соусом"}, {"n": 22, "block": "Кухня", "section": "Горячие блюда", "name": "Томлёная говяжья щека с орзо"}, {"n": 23, "block": "Кухня", "section": "Горячие блюда", "name": "Рибай с мозговой костью"}]};
const m=document.getElementById('m');
(async()=>{
  try{
    const ex=await (await fetch(API+'?t='+DATA.id)).json();
    if(ex && ex.participants && ex.participants.some(p=>p.name==='Yan')){ m.textContent='Уже добавлен, открываем…'; }
    else{
      const r=await (await fetch(API,{method:'POST',body:JSON.stringify({action:'create',pin:'546378',data:DATA})})).json();
      if(!r.ok) throw new Error(r.error||'ошибка');
      m.textContent='Готово, открываем…';
    }
    setTimeout(()=>location.replace('/#/d/'+DATA.id),800);
  }catch(e){ m.textContent='Не получилось: '+e.message+'. Проверьте интернет и обновите страницу.'; }
})();
</script></body></html>
