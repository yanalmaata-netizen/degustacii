<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Роса Афродиты в dg-09</title>
<style>body{margin:0;font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:#F2F0EC;color:#1D2230;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
@media (prefers-color-scheme:dark){body{background:#0B111F;color:#EDE8E0}}</style></head>
<body><p id="m">Добавляем коктейль…</p>
<script>
const API="https://script.google.com/macros/s/AKfycbyhbatWUegEAh9yAj-PlJ1XAxogDaR9OHeBsLzNRldkBhaUz3RjhsQ7AF39GiB6nhcxuA/exec";
const ID='dg-09', NAME='Роса Афродиты';
const m=document.getElementById('m');
(async()=>{
  try{
    const t=await (await fetch(API+'?t='+ID)).json();
    if(!t||t.error) throw new Error('дегустация не найдена');
    if(t.dishes.some(d=>d.name===NAME)){ m.textContent='Коктейль уже добавлен, открываем…'; }
    else{
      const dishes=t.dishes.map(d=>({n:d.n,block:d.block,section:d.section,name:d.name,desc:d.desc||'',allergens:d.allergens||'',photo:d.photoId||d.photo||''}));
      dishes.push({n:Math.max(...dishes.map(d=>d.n))+1,block:'Бар',section:'Безалкогольные коктейли',name:NAME,desc:'',allergens:'',photo:''});
      const greeting=t.greeting.replace('Шеф-бармен Ари представит 5 позиций: глинтвейн, милкшейки.','Шеф-бармен Ари представит 6 позиций: глинтвейн, милкшейки, безалкогольный коктейль.');
      const data={id:ID,project:t.project,participants:t.participants,date:t.date,title:t.title,settings:t.settings,greeting,signature:t.signature,active:!!t.open,chefPhoto:t.chefPhoto||'',blocks:t.blocks,dishes};
      const r=await (await fetch(API,{method:'POST',body:JSON.stringify({action:'create',pin:'546378',data})})).json();
      if(!r.ok) throw new Error(r.error||'ошибка');
      m.textContent='Коктейль добавлен, открываем…';
    }
    setTimeout(()=>location.replace('/#/d/'+ID),800);
  }catch(e){ m.textContent='Не получилось: '+e.message+'. Проверьте интернет и обновите страницу.'; }
})();
</script></body></html>
