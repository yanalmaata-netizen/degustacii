<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Финал dg-09</title>
<style>body{margin:0;font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:#F2F0EC;color:#1D2230;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
@media (prefers-color-scheme:dark){body{background:#0B111F;color:#EDE8E0}}</style></head>
<body><p id="m">Готовим итоги…</p>
<script>
const API="https://script.google.com/macros/s/AKfycbyhbatWUegEAh9yAj-PlJ1XAxogDaR9OHeBsLzNRldkBhaUz3RjhsQ7AF39GiB6nhcxuA/exec";
const ID='dg-09', DROP='Глинтвейн безалкогольный';
const m=document.getElementById('m');
(async()=>{
  try{
    const t=await (await fetch(API+'?t='+ID)).json();
    if(!t||t.error) throw new Error('дегустация не найдена');
    const d=t.dishes.find(x=>x.name===DROP);
    if(!d){ m.textContent='Уже готово, открываем итоги…'; }
    else{
      const r=await (await fetch(API+'?action=results&t='+ID)).json();
      if(!r||!r.ok) throw new Error('не удалось прочитать ответы');
      if(r.answers.some(a=>Number(a['№'])===Number(d.n))) throw new Error('по безалкогольному глинтвейну уже есть оценки, позицию не убираю');
      const dishes=t.dishes.filter(x=>x.n!==d.n).map(x=>({n:x.n,block:x.block,section:x.section,name:x.name,desc:x.desc||'',allergens:x.allergens||'',photo:x.photoId||x.photo||''}));
      const greeting=t.greeting.replace('Шеф-бармен Ари представит 6 позиций: глинтвейн, милкшейки, безалкогольный коктейль.','Шеф-бармен Ари представит 5 позиций: глинтвейн, милкшейки, безалкогольный коктейль.');
      const data={id:ID,project:t.project,participants:t.participants,date:t.date,title:t.title,settings:t.settings,greeting,signature:t.signature,active:!!t.open,chefPhoto:t.chefPhoto||'',blocks:t.blocks,dishes};
      const w=await (await fetch(API,{method:'POST',body:JSON.stringify({action:'create',pin:'546378',data})})).json();
      if(!w.ok) throw new Error(w.error||'ошибка');
      m.textContent='Готово, открываем итоги…';
    }
    setTimeout(()=>location.replace('/#/r/'+ID),800);
  }catch(e){ m.textContent='Не получилось: '+e.message+'.'; }
})();
</script></body></html>
